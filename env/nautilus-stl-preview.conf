# Workaround for WebKit2GTK crashing the sushi previewer on native Wayland
# with NVIDIA (DMABuf/GBM negotiation fails with "Error 71 (Protocol error)
# dispatching to Wayland display"). Disabling the DMABuf renderer forces
# software compositing in WebKit views. Affects all WebKitGTK apps in the
# session (e.g. Epiphany); remove this file if you'd rather not.
WEBKIT_DISABLE_DMABUF_RENDERER=1
