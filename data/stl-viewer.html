<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>STL preview</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1c1109;
    font-family: system-ui, sans-serif;
  }
  #stl-mount { position: absolute; inset: 0; }
  #stl-mount canvas { display: block; }
  #stl-name {
    position: absolute; top: 8px; left: 10px;
    color: rgba(240, 230, 210, 0.55); font-size: 11px;
    pointer-events: none; max-width: 70%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stl-hint {
    position: absolute; bottom: 8px; right: 10px;
    color: rgba(240, 230, 210, 0.45);
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(28, 17, 9, 0.8);
    color: #f0e6d2; font-size: 13px;
  }
  #stl-error { display: none; }
  #stl-error-text { color: #f0a0a0; max-width: 80%; text-align: center; }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(240, 230, 210, 0.25);
    border-top-color: #c9a227;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="stl-mount"></div>
  <div id="stl-name"></div>
  <div id="stl-hint">drag to rotate &middot; scroll to zoom</div>
  <div id="stl-status" class="overlay">
    <div class="spinner"></div>
    <div id="stl-status-text">Loading model&hellip;</div>
  </div>
  <div id="stl-error" class="overlay">
    <div id="stl-error-text"></div>
  </div>
  <script src="stl-viewer.bundle.js"></script>
</body>
</html>
